<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hẹn lịch khách sau cắt</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--surface:#fff;--ink:#141a33;--muted:#5b6280;--line:#e2e5ef;--navy:#1f2a68;--navy-soft:#eceefa;--yellow:#f5cf2e;--yellow-soft:#fff8d9;--good:#1d7a4a;--good-soft:#e6f4ec;--bad:#b4322a;--bad-soft:#fbeceb;--wait:#9a6a00;--wait-soft:#fff3d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--surface:#181c2e;--ink:#e8eaf4;--muted:#9aa1bd;--line:#2a3048;--navy:#a9b4f5;--navy-soft:#22284a;--yellow:#f5cf2e;--yellow-soft:#3a3214;--good:#6fd39c;--good-soft:#173527;--bad:#f08a82;--bad-soft:#3d1d1b;--wait:#f2c55c;--wait-soft:#3a2f12}}
:root[data-theme="dark"]{--bg:#0f1220;--surface:#181c2e;--ink:#e8eaf4;--muted:#9aa1bd;--line:#2a3048;--navy:#a9b4f5;--navy-soft:#22284a;--yellow:#f5cf2e;--yellow-soft:#3a3214;--good:#6fd39c;--good-soft:#173527;--bad:#f08a82;--bad-soft:#3d1d1b;--wait:#f2c55c;--wait-soft:#3a2f12}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{line-height:1.25;margin:0}
h2{font-size:26px;margin:32px 0 6px}
h3{font-size:19px;margin:30px 0 12px}
p{margin:0 0 10px}
a{color:var(--navy)}
.sub{color:var(--muted);max-width:760px;margin-bottom:18px}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gatebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.gatebox .logo{font-weight:700;color:var(--navy);letter-spacing:.04em;font-size:14px}
.gatebox h1{font-size:22px}
.gatebox input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gatebox button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--navy);color:var(--surface);cursor:pointer}
.gatebox button:disabled{opacity:.6}
.gateerr{color:var(--bad);font-size:14px;min-height:20px}
/* hero + tabs */
.hero{background:#1f2a68;color:#fff;padding:40px 0 34px}
.hero .eyebrow{color:#f5cf2e;font-weight:600;font-size:14px;margin-bottom:8px}
.hero h1{font-size:clamp(30px,5vw,44px);margin-bottom:10px}
.hero .lead{font-size:18px;max-width:720px;opacity:.95}
.hero .meta{font-size:14px;opacity:.75;margin:0}
.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:15px;font-weight:500;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 10px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow);font-weight:600}
main{padding-bottom:40px}
/* flow */
.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;font-size:14px;position:relative}
.step.key{border:2px solid var(--navy)}
.step .when{align-self:flex-start;background:var(--navy);color:var(--surface);font-weight:600;font-size:12px;border-radius:6px;padding:2px 8px}
.step .who{color:var(--muted);font-weight:600;font-size:13px}
.step b{font-size:15px;line-height:1.3}
@media (max-width:900px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.flow{grid-template-columns:1fr}}
.branches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.br{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);background:var(--surface)}
.br b{display:block;color:var(--ink);margin-bottom:2px}
.br.good{border:1px solid var(--good);background:var(--good-soft)}
.br.bad{border:1px solid var(--bad);background:var(--bad-soft)}
@media (max-width:900px){.branches{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.branches{grid-template-columns:1fr}}
.rule{background:var(--navy-soft);border-left:4px solid var(--navy);border-radius:8px;padding:12px 14px;margin:16px 0}
.warn{background:var(--yellow-soft);border-left:4px solid var(--yellow);border-radius:8px;padding:12px 14px;margin:18px 0}
.note{color:var(--muted);font-size:14px}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
table.num td:nth-child(n+4){text-align:right;font-variant-numeric:tabular-nums}
td.pos{color:var(--good);font-weight:600}td.neg{color:var(--bad);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.on{background:var(--good-soft);color:var(--good)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.next{background:var(--navy-soft);color:var(--navy)}
.src{display:inline-block;font-weight:600;font-size:13px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.s1{background:var(--navy);color:var(--surface)}.s2{background:var(--yellow);color:#141a33}.s3{background:var(--line);color:var(--ink)}
/* cards */
.cards2,.cards3,.facts,.kpis{display:grid;gap:12px}
.cards2{grid-template-columns:repeat(2,1fr)}.cards3,.facts,.kpis{grid-template-columns:repeat(3,1fr)}
@media (max-width:760px){.cards2,.cards3,.facts,.kpis{grid-template-columns:1fr}}
.card,.facts>div,.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.key{border:2px solid var(--navy)}
.card>b{display:block;margin:2px 0 6px;font-size:16px}
.card p,.card ul{font-size:15px;margin:0 0 6px}
.card ul{padding-left:18px}
span.num{display:block;font-size:13px;color:var(--muted);font-weight:600}
.facts span,.kpis span{font-size:13px;color:var(--muted);font-weight:600}
.facts b{display:block;font-size:17px;margin:2px 0 6px;line-height:1.35}
.facts p{font-size:14px;color:var(--muted);margin:0}
.kpis b{display:block;font-size:34px;color:var(--navy);line-height:1.2;margin:4px 0}
.kpis p{font-size:14px;color:var(--muted);margin:0}
/* why */
.hbar{display:flex;border-radius:10px;overflow:hidden;font-size:13px;font-weight:600;min-height:44px}
.hbar span{display:flex;align-items:center;justify-content:center;padding:6px;text-align:center}
.h-self{background:var(--navy-soft);color:var(--navy)}.h-call{background:var(--yellow);color:#141a33}.h-no{background:var(--line);color:var(--muted)}
.hundred .note{margin-top:8px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 6px}
@media (max-width:640px){.compare{grid-template-columns:1fr}}
.compare .col{border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--surface)}
.compare .new{border:2px solid var(--navy)}
.compare .tag{font-weight:700;font-size:14px}
.compare .old .tag{color:var(--muted)}.compare .new .tag{color:var(--navy)}
.compare ol{margin:8px 0 0;padding-left:20px;font-size:15px}
/* stylist */
blockquote{margin:0 0 14px;background:var(--surface);border-left:4px solid var(--yellow);border-radius:8px;padding:16px 18px;font-size:18px;font-weight:500}
.scripts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.scripts{grid-template-columns:1fr}}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sc b{display:block;margin-bottom:8px}
.sc p{font-style:italic;font-size:15px;border-left:2px solid var(--line);padding-left:10px}
.shots,.zns{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.zns{grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.shots{grid-template-columns:1fr 1fr}.zns{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.zns{grid-template-columns:1fr}}
figure{margin:0}
figure img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);background:#fff}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
figcaption b{color:var(--ink)}
.zcard{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:15px}
.zcard b{display:block;margin-bottom:6px}
.checks{list-style:none;padding:0;margin:0 0 6px}
.checks li{position:relative;padding:6px 0 6px 28px;border-bottom:1px solid var(--line)}
.checks li:before{content:"";position:absolute;left:4px;top:13px;width:12px;height:7px;border-left:2px solid var(--good);border-bottom:2px solid var(--good);transform:rotate(-45deg)}
/* call */
.call{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.call p{margin:0 0 12px}
.call .lb{display:inline-block;min-width:130px;font-size:13px;font-weight:600;color:var(--navy);margin-right:6px}
.call .tip{color:var(--muted);font-size:14px;margin:0}
.outcomes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.outcomes{grid-template-columns:1fr 1fr}}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--muted)}
.oc b{display:block;color:var(--ink);font-size:16px}
.oc.good{background:var(--good-soft);border-color:var(--good)}.oc.bad{background:var(--bad-soft);border-color:var(--bad)}
/* bars */
.bars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bar{display:grid;grid-template-columns:170px 1fr 60px;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.bar .trk{background:var(--bg);border-radius:6px;height:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px;max-width:100%}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.bar{grid-template-columns:1fr 54px}.bar .trk{grid-column:1/-1;grid-row:2}}
.funnel{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0;counter-reset:f}
.funnel li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
/* timeline */
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 18px 22px}
.timeline li:before{content:"";position:absolute;left:-9px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.timeline li.done:before{background:var(--good);border-color:var(--good)}
.timeline li.now:before{background:var(--yellow);border-color:var(--yellow)}
.timeline li.next:before{border-color:var(--navy)}
.timeline span{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.timeline b{display:block;font-size:16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}
details p{margin:8px 0 0;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;padding:24px 16px 40px;border-top:1px solid var(--line)}
@media print{.tabs{display:none}section[hidden]{display:block!important}.hero{background:#1f2a68!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* journey */
.journey{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.journey li{position:relative;padding:34px 12px 0 0}
.journey li:before{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:var(--line)}
.journey li:after{content:"";position:absolute;top:4px;left:0;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--navy)}
.journey li.hl:after{background:var(--yellow);border-color:var(--yellow)}
.journey li.ok:after{background:var(--good);border-color:var(--good)}
.journey li:last-child:before{right:auto;width:20px}
.journey .d{display:block;font-weight:700;color:var(--navy);font-size:15px}
.journey b{display:block;font-size:17px;line-height:1.3;margin:2px 0 4px}
.journey .w{display:block;font-size:14px;color:var(--muted)}
@media (max-width:760px){.journey{grid-template-columns:1fr}.journey li{padding:0 0 18px 32px}.journey li:before{top:0;bottom:0;left:7px;right:auto;width:3px;height:auto}.journey li:last-child:before{display:none}.journey li:after{top:2px}}
.aside{margin:14px 0 0;padding:10px 14px;border:1px dashed var(--bad);border-radius:10px;background:var(--bad-soft);font-size:15px}
table.matrix th[class^=c]{font-size:15px;color:var(--ink);background:var(--surface)}
table.matrix th.c1{box-shadow:inset 0 -4px 0 var(--navy)}
table.matrix th.c2{box-shadow:inset 0 -4px 0 var(--yellow)}
table.matrix th.c3{box-shadow:inset 0 -4px 0 var(--line);color:var(--muted)}
table.matrix tbody th{font-size:14px;color:var(--navy);background:var(--bg);white-space:nowrap}
table.matrix td{width:30%}
table.matrix td:nth-child(4){color:var(--muted)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.status{grid-template-columns:1fr}}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.st ul{margin:8px 0 0;padding-left:18px;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.roles{grid-template-columns:1fr}}
.role{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.role:hover{border-color:var(--navy)}
.role b{display:block;font-size:16px}.role b:after{content:" →";color:var(--navy)}
.role span{font-size:14px;color:var(--muted)}
.window{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.window{grid-template-columns:1fr}}
.window li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.window span{display:block;font-weight:700;color:var(--navy)}
.zns.two{grid-template-columns:repeat(2,minmax(0,340px))}
@media (max-width:460px){.zns.two{grid-template-columns:1fr}}
.checks.no li:before{border:0;width:auto;height:auto;transform:none;content:"✕";color:var(--bad);top:6px;font-weight:700}
b.g{color:var(--good)}b.r{color:var(--bad)}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:640px){.cases{grid-template-columns:1fr}}
.case{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.case b{display:block;color:var(--ink);margin-bottom:2px}
.case.ok{border:1px solid var(--good);background:var(--good-soft)}
.facts.four{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.facts.four{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <form class="gatebox" id="f">
    <span class="logo">30SHINE · TÀI LIỆU NỘI BỘ</span>
    <h1>Hẹn lịch khách sau cắt</h1>
    <p class="note" style="margin:0">Nhập mật khẩu được gửi kèm link để xem tài liệu.</p>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Mở tài liệu</button>
    <div class="gateerr" id="err"></div>
  </form>
</div>
<div id="app" hidden></div>

(function(){
  var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err'),gate=document.getElementById('gate'),app=document.getElementById('app');
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  function open(p){
    go.disabled=true;go.textContent='Đang mở…';err.textContent='';
    crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);gate.hidden=true;app.hidden=false;try{sessionStorage.setItem('henlich_pw',p)}catch(e){}init()})
    .catch(function(){err.textContent='Mật khẩu chưa đúng, kiểm tra lại giúp bạn nhé.';go.disabled=false;go.textContent='Mở tài liệu';pw.select()});
  }
  f.addEventListener('submit',function(e){e.preventDefault();open(pw.value)});
  try{var s=sessionStorage.getItem('henlich_pw');if(s){pw.value=s;open(s)}}catch(e){}
  function init(){
    var tabs=[].slice.call(app.querySelectorAll('[role="tab"]'));
    function show(id,scroll){
      if(!document.getElementById(id))id=tabs[0].getAttribute('aria-controls');
      tabs.forEach(function(t){var on=t.getAttribute('aria-controls')===id;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;if(on)t.scrollIntoView({block:'nearest',inline:'nearest'})});
      try{history.replaceState(null,'','#'+id)}catch(e){}
      if(scroll){var n=app.querySelector('.tabs');window.scrollTo({top:n.offsetTop})}
    }
    tabs.forEach(function(t,i){
      t.addEventListener('click',function(){show(t.getAttribute('aria-controls'),true)});
      t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();var n=tabs[(i+d+tabs.length)%tabs.length];show(n.getAttribute('aria-controls'),false);n.focus()}});
    });
    [].forEach.call(app.querySelectorAll('[data-go]'),function(x){x.addEventListener('click',function(e){e.preventDefault();show(x.getAttribute('data-go'),true)})});
    show(location.hash.slice(1),false);
  }
})();
